      properties:
        request_id: { type: string, minLength: 1 }
        request_chain_id: { type: string, minLength: 1 }
        actor_ref: { $ref: '#/components/schemas/ActorIdString' }
        workload_kind: { $ref: '#/components/schemas/WorkloadKind' }
        subject_id: { type: string, minLength: 1 }
        model_ref: { type: string, minLength: 1 }
        requested_gpu_count: { type: integer }  # types only on the wire (triage decision D9); the core decides ranges and journals DENY(INVALID_REQUEST)
        requested_vram_gb_per_gpu: { type: integer }
        expected_duration_min: { type: integer }
        exam_binding: { type: [string, 'null'] }
        derived_from: { $ref: '#/components/schemas/Uuid7String' }
