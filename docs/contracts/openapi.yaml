        trace: { type: array, items: { $ref: '#/components/schemas/TraceEntryDto' } }
        suppressed: { type: array, items: { $ref: '#/components/schemas/SuppressedRuleDto' } }
        citations: { type: array, items: { $ref: '#/components/schemas/PolicyDocId' }, minItems: 1 }
        policy_version: { $ref: '#/components/schemas/PolicyVersionSeq' }
        content_hash: { $ref: '#/components/schemas/Sha256Hex' }
        engine_version: { type: string }
        campus_tz: { type: string }
        tzdata_version: { type: string }
        evaluated_at: { $ref: '#/components/schemas/InstantString' }
        valid_until: { oneOf: [{ $ref: '#/components/schemas/InstantString' }, { type: 'null' }] }
        must_checkpoint_by: { oneOf: [{ $ref: '#/components/schemas/InstantString' }, { type: 'null' }] }
        retry_after_ms: { type: [integer, 'null'], minimum: 0 }
        stale_facts: { type: array, items: { type: string } }
        evidence_snapshot_ref: { type: string, minLength: 1 }
        request_chain_id: { type: string, minLength: 1 }
        subject_id: { type: string, minLength: 1, description: 'decision.subject_id (N2).' }
        model_ref: { type: string, minLength: 1, description: 'decision.model_ref (N2).' }
        node_class_id: { oneOf: [{ type: string, minLength: 1 }, { type: 'null' }], description: 'decision.node_class_id (N2); nullable.' }
        derived_from: { oneOf: [{ $ref: '#/components/schemas/Uuid7String' }, { type: 'null' }] }
        parent_kind: { $ref: '#/components/schemas/ParentKind' }
        depth: { type: integer, minimum: 0, maximum: 1 }
        originating_actor_id: { $ref: '#/components/schemas/ActorIdString' }
        submitted_by: { $ref: '#/components/schemas/SubmittedBy' }
        explanation: { $ref: '#/components/schemas/ExplanationDto' }
    EvaluateRequestDto:
      type: object
      additionalProperties: false
