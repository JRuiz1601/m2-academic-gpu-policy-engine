# openapi.yaml — Module M2 Academic GPU Policy Engine (task P2-API-1, Solu-2 Phase 2, Step 2.2)
# OpenAPI 3.1. 14 operations on 13 path items (GET and POST share /policy/freezes). Route 14, POST /policy/versions/publish, was added on 2026-10-21 (decision DL-41).
# Sources: AR = planning/ARCHITECTURE.md section 5.1; CT = planning/detailed-design/contracts.md sections 2 and 3;
# schemas below mirror planning/detailed-design/schemas/dto.ts by the same names.
# "PROPOSED, human to confirm" marks a choice the files do not settle.
openapi: 3.1.0
info:
  title: M2 Academic GPU Policy Engine API
  version: 1.0.0
  description: >-
    The 13 routes of AR 5.1 plus route 14, POST /policy/versions/publish (decision DL-41). A DENY is a 200 response with a Decision body (AR 5.1, ruling K1).
    Error responses use ErrorBodyDto; the status of each code is the one in contracts.md section 3.
    The codes UNAUTHENTICATED and DERIVED_FROM_INVALID have no status in contracts.md, and SNAPSHOT_EVICTED has no
    route among the 13; they are not attached to any response (needs human decision).
servers:
  - url: /
    description: PROPOSED, human to confirm - the base URL is not stated in the files.
security:
  - sessionBearer: []
tags:
  - name: decisions
  - name: policy
  - name: freezes
  - name: health
paths:
  /policy/decisions:
    post:
      tags: [decisions]
      operationId: evaluateRequest
      summary: Evaluate one request (AR 5.1; CT evaluateRequest)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequestDto' }
      responses:
        '200':
          description: A Decision for all three outcomes, including DENY (AR 5.1, K1). The body includes trace[] and evidence_snapshot_ref (D6).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluateResponseDto' }
        '400':
          description: Wire shape or missing key (CT evaluateRequest P1, P2).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [WIRE_SHAPE_INVALID, IDEMPOTENCY_KEY_MISSING] }
        '409':
          description: Idempotency conflict (CT evaluateRequest P4).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [IDEMPOTENCY_BODY_MISMATCH, IDEMPOTENCY_KEY_EXPIRED] }
        '503':
          description: No Decision was produced (CT evaluateRequest P6; AR 3). Also returned, with no Decision, no event and no outbox row, when the Clock port returns no instant at all (failing_port campus.clock; triage decision D2, carve-out PROPOSED, human to confirm).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [FREEZE_STATE_UNREADABLE, DECISION_NOT_PRODUCED] }
  /policy/decisions/preview:
    post:
      tags: [decisions]
      operationId: previewDecision
      summary: Same evaluation, not journalled, not published (AR 5.1)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - name: evaluated_at_override
          in: query
          required: false
          description: AR 5.1 (EDGE-10). Gated by role_tier >= INSTRUCTOR and the deployment flag ALLOW_CLOCK_OVERRIDE.
          schema: { $ref: '#/components/schemas/InstantString' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequestDto' }
      responses:
        '200':
          description: A Decision (AR 5.1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluateResponseDto' }
        '400':
          description: Identical to POST /policy/decisions (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [WIRE_SHAPE_INVALID, IDEMPOTENCY_KEY_MISSING] }
        '403':
          description: Unauthorised clock override (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [CLOCK_OVERRIDE_FORBIDDEN] }
        '409':
          description: Identical to POST /policy/decisions (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [IDEMPOTENCY_BODY_MISMATCH, IDEMPOTENCY_KEY_EXPIRED] }
        '503':
          description: Identical to POST /policy/decisions (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [FREEZE_STATE_UNREADABLE, DECISION_NOT_PRODUCED] }
  /policy/window-boundary:
    post:
      tags: [decisions]
      operationId: evaluateWindowBoundary
      summary: Evaluate a night-window job against the 06:00:00 hard boundary (Impl-2 story 2.4, AD-04). The annex names this /api/v1/policy/evaluate-window-boundary.
      description: >-
        Read-only, not journalled, no Idempotency-Key. Campus-local time (America/Panama, UTC-05:00) is read from the Clock port.
        A NIGHT policy hard-expires at 06:00:00. Five minutes or less before it the answer is EVICT_WARNING; at or after it, EVICT.
        An extension that would end after 06:00:00 is denied unconditionally (DENY, rule R-BOUND-01) and the reason cites the first scheduled class of the morning.
        The outcome is a 200 body, as for every policy decision (AR 5.1, K1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WindowBoundaryRequestDto' }
      responses:
        '200':
          description: The boundary evaluation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WindowBoundaryResponseDto' }
        '400':
          description: Wire shape invalid (unknown field, approved_policy other than NIGHT, non-positive extension).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [WIRE_SHAPE_INVALID] }
        '401':
          description: No session.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [UNAUTHENTICATED] }
        '503':
          description: The timetable or the clock could not be read; no evaluation was produced.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [DECISION_NOT_PRODUCED] }
  /policy/rules:
    get:
      tags: [policy]
      operationId: getRules
      summary: The rule set (AR 5.1)
      parameters:
        - name: version
          in: query
          required: false
          description: Defaults to the active version (AR 5.1).
          schema: { $ref: '#/components/schemas/PolicyVersionSeq' }
      responses:
        '200':
          description: The rules of the requested version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RulesResponseDto' }
        '404':
          description: Unknown version (AR 5.1; CT VERSION_NOT_FOUND).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [VERSION_NOT_FOUND] }
        '503':
          description: Registry artefact unreadable (AR 5.1; CT REGISTRY_UNREADABLE).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [REGISTRY_UNREADABLE] }
  /policy/versions:
    get:
      tags: [policy]
      operationId: listVersions
      summary: Version history (AR 5.1)
      parameters:
        - name: since_seq
          in: query
          required: false
          description: AR 5.1 - returns versions with published_seq greater than the value.
          schema: { $ref: '#/components/schemas/PolicyVersionSeq' }
      responses:
        '200':
          description: Version manifests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionsResponseDto' }
        '503':
          description: Registry artefact unreadable (AR 5.1; CT REGISTRY_UNREADABLE).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [REGISTRY_UNREADABLE] }
  /policy/versions/publish:
    post:
      tags: [policy]
      operationId: publishVersion
      summary: Publish a new policy version (route 14; decision DL-41, 2026-10-21)
      description: >-
        Rule Registry publisher (AR 2.2). Writes one immutable policy_version row and one decision_outbox row
        with event_type policy.version.published.v1 in the same transaction (AR M2-AD-7, M2-AD-8). The request body,
        the allowed role and the success status are not stated in the sources: open point 12 of contracts.md section 6.
        Status 201 and the manifest body are PROPOSED, human to confirm.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishVersionRequestDto' }
      responses:
        '201':
          description: The manifest of the new version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionManifestDto' }
  /policy/versions/{v}:
    get:
      tags: [policy]
      operationId: getVersion
      summary: One frozen version (AR 5.1)
      parameters:
        - name: v
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PolicyVersionSeq' }
      responses:
        '200':
          description: The manifest, the rendered rules and the 12 policy documents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionDetailResponseDto' }
        '404':
          description: Unknown version (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [VERSION_NOT_FOUND] }
  /policy/freezes:
    post:
      tags: [freezes]
      operationId: createFreezeDraft
      summary: Create a FreezeDraft (AR 5.1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFreezeDraftRequestDto' }
      responses:
        '201':
          description: The draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateFreezeDraftResponseDto' }
        '400':
          description: Missing reason, ends_at <= starts_at, or ends_at <= campus_now (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [WIRE_SHAPE_INVALID, MISSING_REASON, WINDOW_INVALID_RANGE, WINDOW_IN_PAST] }
        '403':
          description: Caller below role_tier INSTRUCTOR with LAB_OPERATOR scope (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [ROLE_INSUFFICIENT] }
        '503':
          description: AR 5.1 lists 503 for this route; contracts.md names no code for it (needs human decision).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBodyDto' }
    get:
      tags: [freezes]
      operationId: listFreezes
      summary: List freeze states and live drafts (AR 5.1)
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/FreezeLifecycleState' }
        - name: scope
          in: query
          required: false
          schema: { $ref: '#/components/schemas/FreezeScope' }
        - name: from
          in: query
          required: false
          schema: { $ref: '#/components/schemas/InstantString' }
        - name: to
          in: query
          required: false
          schema: { $ref: '#/components/schemas/InstantString' }
      responses:
        '200':
          description: Items and count (UX-5; PROPOSED, human to confirm).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreezeListResponseDto' }
        '403':
          description: Caller below role_tier INSTRUCTOR with LAB_OPERATOR scope (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [ROLE_INSUFFICIENT] }
  /policy/freezes/preview:
    post:
      tags: [freezes]
      operationId: previewFreeze
      summary: Compute a draft's consequences and persist a PreviewRun (AR 5.1; CT previewFreeze)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewFreezeRequestDto' }
      responses:
        '200':
          description: The preview and its token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewFreezeResponseDto' }
        '400':
          description: Wire shape (CT previewFreeze P1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [WIRE_SHAPE_INVALID] }
        '403':
          description: Role (CT previewFreeze P3).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [ROLE_INSUFFICIENT] }
        '404':
          description: Unknown draft (CT previewFreeze P4; status assigned in contracts.md).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [DRAFT_NOT_FOUND] }
        '409':
          description: Expired draft (CT previewFreeze P5; status assigned in contracts.md).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [DRAFT_EXPIRED] }
        '503':
          description: The preview cannot be computed; activation stays blocked (AR 5.1, D1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [PREVIEW_UNAVAILABLE] }
  /policy/freezes/{id}/activate:
    post:
      tags: [freezes]
      operationId: activateFreeze
      summary: Activate a draft (AR 5.1; CT activateFreeze). The path id is the draft_id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UuidString' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateFreezeRequestDto' }
      responses:
        '201':
          description: The activated freeze.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivateFreezeResponseDto' }
        '400':
          description: CT activateFreeze P1, P6, P7.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [WIRE_SHAPE_INVALID, MISSING_REASON, WINDOW_IN_PAST] }
        '403':
          description: Role read fresh at activation (CT activateFreeze P3).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [ROLE_INSUFFICIENT] }
        '404':
          description: Unknown draft (CT activateFreeze P4; status assigned in contracts.md).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [DRAFT_NOT_FOUND] }
        '409':
          description: Draft expiry, token and scope conflicts (CT activateFreeze P5, P8-P11).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [DRAFT_EXPIRED, TOKEN_ABSENT, TOKEN_STALE, TOKEN_ACTOR_MISMATCH, TOKEN_CONSUMED, PREVIEW_EXPIRED, DUPLICATE_ACTIVE_FREEZE] }
  /policy/freezes/{id}/lift:
    post:
      tags: [freezes]
      operationId: liftFreeze
      summary: Lift a freeze (AR 5.1). The path id is the freeze_id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UuidString' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiftFreezeRequestDto' }
      responses:
        '200':
          description: The lifted freeze (AR 5.1 gives 200 only; body PROPOSED, human to confirm).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiftFreezeResponseDto' }
        '400':
          description: Missing lift_reason (AR 5.1 "400 no reason").
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [MISSING_REASON] }
        '403':
          description: Caller below role_tier INSTRUCTOR with LAB_OPERATOR scope (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [ROLE_INSUFFICIENT] }
        '404':
          description: Unknown freeze (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [FREEZE_NOT_FOUND] }
        '409':
          description: The freeze is not ACTIVE (already LIFTED, EXPIRED, or never activated), or the id is a draft id (triage decision D8).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [FREEZE_NOT_LIFTABLE] }
  /policy/freezes/{id}:
    get:
      tags: [freezes]
      operationId: getFreeze
      summary: One freeze with its computed lifecycle state (AR 5.1)
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UuidString' }
      responses:
        '200':
          description: The freeze.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreezeDto' }
        '403':
          description: Caller below role_tier INSTRUCTOR with LAB_OPERATOR scope (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [ROLE_INSUFFICIENT] }
        '404':
          description: Unknown freeze (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [FREEZE_NOT_FOUND] }
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness (AR 5.1). No authentication (D4).
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponseDto' }
  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness (AR 5.1). No authentication (D4).
      security: []
      responses:
        '200':
          description: Registry validated, clock reachable at stratum <= 4, store writable, bus reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyResponseDto' }
        '503':
          description: A readiness check is false; the failing check is named (AR 5.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorBodyDto'
                  - type: object
                    properties:
                      code: { enum: [READY_CHECK_FAILED] }
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      description: PROPOSED, human to confirm - the Gateway authenticates and injects the session actor (AR M2-AD-9); the scheme is not stated.
  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: AR 5.1 (D2) - unique per (actor_id, key); a replay inside the 24-hour window returns the stored Decision. Length and charset are not stated.
      schema: { type: string, minLength: 1 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: AR 5.1 (N5) - optional on POST /policy/decisions/preview; that route is not journalled.
      schema: { type: string, minLength: 1 }
  schemas:
    WindowBoundaryRequestDto:
      type: object
      additionalProperties: false
      required: [job_ref, workload_kind, approved_policy]
      properties:
        job_ref: { type: string, minLength: 1 }
        workload_kind: { $ref: '#/components/schemas/WorkloadKind' }
        approved_policy: { enum: [NIGHT] }
        extension_minutes: { type: integer, minimum: 1 }
    WindowBoundaryResponseDto:
      type: object
      additionalProperties: false
      required: [action, minutes_remaining, hard_deadline, reason, rule_id]
      properties:
        action: { enum: [CONTINUE, EVICT_WARNING, EVICT, EXTEND_ALLOWED, DENY] }
        minutes_remaining: { type: integer, minimum: 0 }
        hard_deadline: { type: string, pattern: '^06:00:00$' }
        reason: { type: string, minLength: 1 }
        rule_id: { type: string, minLength: 1 }
    UuidString: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
    Uuid7String: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$' }
    InstantString: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$' }
    ActorIdString: { type: string, minLength: 1 }
    PolicyVersionSeq: { type: integer, minimum: 1 }
    Sha256Hex: { type: string, pattern: '^[0-9a-f]{64}$' }
    PolicyDocId: { type: string, minLength: 1 }
    DecisionCause:
      enum: [INVALID_REQUEST, ACTOR_UNKNOWN, MODEL_NOT_FOUND, NO_SUCH_HARDWARE, HARDWARE_FAILING, NOT_AUTHORIZED, WINDOW_PROTECTED, FREEZE_ACTIVE, QUOTA_EXHAUSTED, DEPENDENCY_UNAVAILABLE]
    DecisionOutcome: { enum: [ALLOW, DENY, CONSTRAIN] }
    DecisionAdmission: { enum: [ADMITTED, QUEUED, REJECTED] }
    DecisionAuthority: { enum: [PROVISIONAL, FINAL] }
    TraceState: { enum: [MATCH, NO_MATCH, NOT_EVALUATED] }
    BoundRole: { enum: [governing, superseded, outside_horizon] }
    ConstraintKind: { enum: [RESOURCE_SUBSTITUTION, HARD_DEADLINE, QUEUE_ONLY, QUOTA_CAP, WINDOW_SCOPE, MODEL_VARIANT] }
    WorkloadKind: { enum: [INTERACTIVE_INFERENCE, BACKGROUND_BATCH, TRAINING, EVALUATION, EXAM_BOUND] }
    ParentKind: { enum: [ROOT, DERIVED] }
    SubmittedBy: { enum: [HUMAN, SYSTEM] }
    FreezeScope: { enum: [ALL, SUBJECT, NODE_CLASS] }
    FreezeStoredState: { enum: [DRAFT, ACTIVE, LIFTED, EXPIRED] }  # EXPIRED is stored only by the closing step of activateFreeze (triage decision D5)
    FreezeLifecycleState: { enum: [DRAFT, ACTIVE, LIFTED, EXPIRED] }
    FailureStage: { enum: [PORT_FETCH, CONTEXT_BUILD, RENDER] }
    ObligationState: { enum: [ACKED, MISSED, UNCONFIRMED] }
    ErrorCodeDto:
      enum:
        - WIRE_SHAPE_INVALID
        - IDEMPOTENCY_KEY_MISSING
        - IDEMPOTENCY_BODY_MISMATCH
        - IDEMPOTENCY_KEY_EXPIRED
        - UNAUTHENTICATED
        - ROLE_INSUFFICIENT
        - CLOCK_OVERRIDE_FORBIDDEN
        - DERIVED_FROM_INVALID
        - FREEZE_STATE_UNREADABLE
        - DECISION_NOT_PRODUCED
        - SNAPSHOT_EVICTED
        - VERSION_NOT_FOUND
        - REGISTRY_UNREADABLE
        - READY_CHECK_FAILED
        - DRAFT_NOT_FOUND
        - FREEZE_NOT_FOUND
        - FREEZE_NOT_LIFTABLE
        - DRAFT_EXPIRED
        - MISSING_REASON
        - WINDOW_INVALID_RANGE
        - WINDOW_IN_PAST
        - TOKEN_ABSENT
        - TOKEN_STALE
        - TOKEN_ACTOR_MISMATCH
        - TOKEN_CONSUMED
        - PREVIEW_EXPIRED
        - DUPLICATE_ACTIVE_FREEZE
        - PREVIEW_UNAVAILABLE
        - INVALID_REQUEST
        - ACTOR_UNKNOWN
        - MODEL_NOT_FOUND
        - NO_SUCH_HARDWARE
        - HARDWARE_FAILING
        - NOT_AUTHORIZED
        - WINDOW_PROTECTED
        - FREEZE_ACTIVE
        - QUOTA_EXHAUSTED
        - DEPENDENCY_UNAVAILABLE
    ErrorBodyDto:
      type: object
      additionalProperties: false
      required: [code, http_status, message, retry_after_ms, failing_port, stage, failing_check]
      properties:
        code: { $ref: '#/components/schemas/ErrorCodeDto' }
        http_status: { type: integer }
        message: { type: string }
        retry_after_ms: { type: [integer, 'null'], minimum: 0 }
        failing_port: { type: [string, 'null'] }
        stage: { oneOf: [{ $ref: '#/components/schemas/FailureStage' }, { type: 'null' }] }
        failing_check: { type: [string, 'null'] }
    ObservedValueDto:
      type: object
      additionalProperties: false
      required: [fact_path, value]
      properties:
        fact_path: { type: string }
        value: { type: [string, integer, boolean, 'null'] }
    ThresholdDto:
      type: object
      additionalProperties: false
      required: [fact_path, comparator, value]
      properties:
        fact_path: { type: string }
        comparator: { enum: [LT, LE, EQ, GE, GT, IN, NOT_IN] }
        value: { type: [string, integer, boolean, 'null'] }
    ExplanationDto:
      type: object
      additionalProperties: false
      required: [primary_rule_id, rule_ids, observed_values, thresholds, citation_ids]
      properties:
        primary_rule_id: { type: string }
        rule_ids: { type: array, items: { type: string } }
        observed_values: { type: array, items: { $ref: '#/components/schemas/ObservedValueDto' } }
        thresholds: { type: array, items: { $ref: '#/components/schemas/ThresholdDto' } }
        citation_ids: { type: array, items: { $ref: '#/components/schemas/PolicyDocId' } }
    TraceEntryDto:
      type: object
      additionalProperties: false
      required: [seq, rule_id, state, evidence, precedence, bound_role]
      properties:
        seq: { type: integer, minimum: 0 }
        rule_id: { type: string }
        state: { $ref: '#/components/schemas/TraceState' }
        evidence: { type: array, items: { $ref: '#/components/schemas/ObservedValueDto' } }
        precedence: { type: integer, minimum: -1, maximum: 1000 }
        bound_role: { oneOf: [{ $ref: '#/components/schemas/BoundRole' }, { type: 'null' }] }
    SuppressedRuleDto:
      type: object
      additionalProperties: false
      required: [seq, rule_id, would_have_fired_on]
      properties:
        seq: { type: integer, minimum: 0 }
        rule_id: { type: string }
        would_have_fired_on: { type: array, items: { $ref: '#/components/schemas/ObservedValueDto' } }
    ConstraintValueDto:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, must_checkpoint_by]
          properties:
            kind: { const: HARD_DEADLINE }
            must_checkpoint_by: { $ref: '#/components/schemas/InstantString' }
        - type: object
          additionalProperties: false
          required: [kind, queue_estimate_ref]
          properties:
            kind: { const: QUEUE_ONLY }
            queue_estimate_ref: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, cap_value, requires_commit_confirmation]
          properties:
            kind: { const: QUOTA_CAP }
            cap_value: { type: integer, minimum: 0 }
            requires_commit_confirmation: { type: boolean }
        - type: object
          additionalProperties: false
          required: [kind, boundary_ref]
          properties:
            kind: { const: WINDOW_SCOPE }
            boundary_ref: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, model_ref]
          properties:
            kind: { const: MODEL_VARIANT }
            model_ref: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, requested_gpu_count, requested_vram_gb_per_gpu]
          properties:
            kind: { const: RESOURCE_SUBSTITUTION }
            requested_gpu_count: { type: integer }
            requested_vram_gb_per_gpu: { type: integer }
    ConstraintDto:
      type: object
      additionalProperties: false
      required: [constraint_id, kind, value, reason, enforced_by, deadline]
      properties:
        constraint_id: { $ref: '#/components/schemas/UuidString' }
        kind: { $ref: '#/components/schemas/ConstraintKind' }
        value: { $ref: '#/components/schemas/ConstraintValueDto' }
        reason: { type: string }
        enforced_by: { type: string, minLength: 1 }
        deadline: { oneOf: [{ $ref: '#/components/schemas/InstantString' }, { type: 'null' }] }
    DecisionDto:
      type: object
      additionalProperties: false
      required: [decision_id, outcome, admission, authority, primary_rule_id, cause, rationale, next_actions, constraints, trace, suppressed, citations, policy_version, content_hash, engine_version, campus_tz, tzdata_version, evaluated_at, valid_until, must_checkpoint_by, retry_after_ms, stale_facts, evidence_snapshot_ref, request_chain_id, subject_id, model_ref, node_class_id, derived_from, parent_kind, depth, originating_actor_id, submitted_by, explanation]
