        decision_id: { $ref: '#/components/schemas/Uuid7String' }
        outcome: { $ref: '#/components/schemas/DecisionOutcome' }
        admission: { $ref: '#/components/schemas/DecisionAdmission' }
        authority: { $ref: '#/components/schemas/DecisionAuthority' }
        primary_rule_id: { type: string, minLength: 1 }
        cause: { oneOf: [{ $ref: '#/components/schemas/DecisionCause' }, { type: 'null' }] }
        rationale: { type: string, minLength: 1 }
