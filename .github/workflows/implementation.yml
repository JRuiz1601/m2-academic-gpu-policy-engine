name: Impl-2 verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run coverage
      - uses: grafana/setup-k6-action@v1.3.0
      # The k6 thresholds still fail this step; continue so E2E runs, then the quality gate (last step) fails the job on p95.
      - run: npm run nfr
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:trace
      - run: npm run quality-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl2-evidence
          path: |
            test/evidence/impl1-*
            test/evidence/nfr
            test/evidence/quality-gate.json
            playwright-report
            test-results/**/trace.zip
            coverage
          if-no-files-found: ignore
