name: M2 solutioning preparation
on: [push, pull_request]
jobs:
  preparation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: M2-Academic-GPU-Policy-Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-preparation-evidence
          path: M2-Academic-GPU-Policy-Engine/test/evidence/
